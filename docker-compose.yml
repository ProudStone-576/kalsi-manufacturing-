# Production-style local run: docker compose up --build
# Put real secrets in .env (not committed); see .env.example.
services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - enquiries:/data
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  enquiries:
